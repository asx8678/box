name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      # Ubuntu's AppArmor blocks unprivileged user namespaces; bubblewrap's
      # own CI does the same (containers/bubblewrap#728).
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Vet
        run: make vet
      - name: Unit tests
        run: go test -count=1 -race $(go list ./... | grep -v /test/e2e)
      - name: box --doctor
        run: go run . --doctor
      # Verbose, and failing instead of skipping, so the log shows every
      # end-to-end result, including the Ctrl+C decision (plan B3).
      - name: End-to-end tests
        env:
          BOX_E2E_REQUIRED: "1"
        run: |
          set -o pipefail
          go test -count=1 -v ./test/e2e 2>&1 | tee e2e.log
      # Run annotations are public, unlike logs: put the failures in one, so
      # they can be read without signing in.
      - name: Report end-to-end failures
        if: failure()
        run: |
          grep -E -- '--- FAIL|_test\.go:[0-9]+:|panic:|^FAIL' e2e.log | head -80 |
            sed 's/%/%25/g' | awk 'BEGIN{ORS="%0A"} {print}' | sed 's/^/::error title=e2e failures::/'
          echo
      - name: Build
        run: make build-linux
